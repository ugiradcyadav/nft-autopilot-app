name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build APK and Capture Log
      run: ./gradlew assembleDebug > build_output.log 2>&1 || true

    - name: Extract KSP Errors
      run: |
        echo "================ EXACT KSP ERRORS ================"
        grep -n -i -A 2 "e: \[ksp\]" build_output.log || echo "No KSP errors found."
        echo "=================================================="

    - name: Check Build Status
      run: |
        if grep -q "BUILD FAILED" build_output.log; then
          echo "Build failed. See the exact errors above."
          exit 1
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
